  </text>
  <text x="80" y="380" fill="#9aa5b5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32">
    卡片和详情页顶部都会显示这张图（16:9 效果最好）
  </text>
  <text x="80" y="450" fill="#ffcf5c" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28">
