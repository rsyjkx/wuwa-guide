<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="示例封面图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17324a" />
      <stop offset="1" stop-color="#0e1116" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="980" cy="120" r="220" fill="#6cc1ff" opacity="0.1" />
  <circle cx="240" cy="600" r="180" fill="#ffcf5c" opacity="0.08" />
  <text x="80" y="320" fill="#e7eaf0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="700">
