# Staticman 配置（v2 公共实例使用仓库根目录的 staticman.yml）
#
# 站点读取流程：
#   表单 POST → Staticman 校验 → 在仓库里新建文件并创建 Pull Request（因为 moderation: true）
#   → 站长合并 → Cloudflare Pages 自动重建 → Pagefind 重建索引
#
# 这个文件里有两个 property 段：guides 与 teams。
# 段名同时出现在提交地址里：
#   https://best.staticman.net/v2/entry/{user}/{repo}/{branch}/guides
#   https://best.staticman.net/v2/entry/{user}/{repo}/{branch}/teams
#
# 字段规则说明：
#   allowedFields  —— 只允许这些字段（顶层键）；出现其它非空字段会返回 INVALID_FIELDS。
#                     表单里的蜜罐字段 `_honeypot` 故意不写进 allowedFields：
#                     正常用户留空 → 空值放行；机器人填了内容 → 直接被拒绝。
#   requiredFields —— 缺任意一项就返回 MISSING_REQUIRED_FIELDS。
#   generatedFields —— 站点端不需要手填 date，由 Staticman 自动写入。
#   transforms.content: frontmatterContent —— 告诉 Staticman 哪些内容进入正文，
#                     其余字段写成 YAML frontmatter，最终产出 `.md` 文件。
#   members 是对象数组：表单用 fields[members][N][name] / fields[members][N][role] 提交，
#   Staticman 的 urlencoded 解析会得到 [{ name, role }]，写成 YAML 后就是对象数组。

guides:
  # 只允许这些字段，防止有人往仓库里塞奇怪的东西
  allowedFields:
    [
      "title",
      "character",
      "author",
      "version",
      "tags",
      "cover",
      "images",
      "video",
      "content",
    ]

  # 必须与提交地址里的分支一致
  branch: "main"

  # PR 标题 / 提交信息，可用占位符
  commitMessage: "新攻略投稿：{fields.title}"

  # 文件名：时间戳保证唯一，正则化后是纯 ASCII，URL 友好
  filename: "guide-{@timestamp}"
  extension: "md"

  # frontmatter + 正文 的 Markdown
  format: "frontmatter"

  # 自动补 submit 日期（ISO8601 字符串，Astro 侧用 z.coerce.date() 接收）
  generatedFields:
    date:
      type: date
      options:
        format: "iso8601"

  # 开启审核：只创建 Pull Request，不直接写主分支
  moderation: true

  # 输出目录（相对仓库根目录），与 Astro content collection 的 base 一致
  path: "src/content/guides"

  requiredFields: ["title", "character", "content"]

  # content 走正文，其余字段进 frontmatter
  transforms:
    content: frontmatterContent

  pullRequestBody: |
    感谢投稿！请站长在合并前确认：
    - 角色名（character）与正文里的角色一致
    - 正文没有明显的抄袭 / 广告 / 外部引流
    - frontmatter 字段完整（title / character / date）

    合并后 Cloudflare Pages 会自动重建并更新搜索索引。

teams:
  allowedFields:
    [
      "teamName",
      "coreCharacter",
      "members",
      "element",
      "tier",
      "scenario",
      "summary",
      "author",
      "cover",
      "images",
      "video",
      "content",
    ]

  branch: "main"

  commitMessage: "新配队投稿：{fields.teamName}"

  filename: "team-{@timestamp}"
  extension: "md"

  format: "frontmatter"

  generatedFields:
    date:
      type: date
      options:
        format: "iso8601"

  moderation: true

  path: "src/content/teams"

  requiredFields: ["teamName", "coreCharacter", "members", "element", "content"]

  transforms:
    content: frontmatterContent

  pullRequestBody: |
    感谢投稿！请站长在合并前确认：
    - coreCharacter 是这支队伍真正的核心（角色页的"相关配队"按它匹配）
    - members 是对象数组，每项都有 name 和 role
    - element 是体系标签（如 冷凝 / 热熔 / 聚爆 / 风蚀 / 湮灭）
    - tier 仅作展示，不参与排序

    合并后 Cloudflare Pages 会自动重建并更新搜索索引。
