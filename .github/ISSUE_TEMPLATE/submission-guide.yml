name: 投稿：单角色攻略
description: 提交一篇《鸣潮》单角色攻略。提交后机器人会自动生成 PR，站长批准合并后才会发布。
title: '[攻略] '
labels: ['submission']
body:
  - type: markdown
    attributes:
      value: |
        填完点 **Submit new issue** 就行，不需要懂 Markdown 文件结构。
        机器人会自动把你的内容转成站点文件并开一个 Pull Request，等站长批准。

        > 建议先看一眼 [内容规范](https://github.com/rsyjkx/wuwa-guide/blob/main/README.md#6-内容规范)。

  - type: input
    id: guide-title
    attributes:
      label: 攻略标题
      description: 会显示在列表和搜索里
      placeholder: 今汐 2.4 版本输出手法与共鸣链选择
    validations:
      required: true

  - type: input
    id: character
    attributes:
      label: 角色名
      description: 只写名字，用于角色页筛选
      placeholder: 今汐
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 适用游戏版本（可选）
      placeholder: '2.4'

  - type: input
    id: tags
    attributes:
      label: 标签（可选）
      description: 用逗号分隔
      placeholder: 输出手法, 共鸣链

  - type: input
    id: author
    attributes:
      label: 作者昵称（可选）
      placeholder: 洄游的鲸

  - type: textarea
    id: content
    attributes:
      label: 正文（支持 Markdown）
      description: 建议 300 字以上，用小标题分段
      placeholder: |
        ## 起手与循环

        1. ……

        ## 声骸搭配

        ……
    validations:
      required: true

  - type: input
    id: cover
    attributes:
      label: 封面图链接（可选）
      description: 图片链接；仓库里的图可以写 /media/xxx.png
      placeholder: https://… 或 /media/cover.png

  - type: textarea
    id: images
    attributes:
      label: 图集链接（可选）
      description: 一行一个，最多 12 张
      placeholder: |
        https://…
        /media/shot-1.png

  - type: input
    id: video
    attributes:
      label: 视频链接（可选）
      description: B 站 / YouTube 链接，或 .mp4 直链
      placeholder: https://www.bilibili.com/video/BV…
