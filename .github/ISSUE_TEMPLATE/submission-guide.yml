name: 投稿：单角色攻略
description: 提交一篇《鸣潮》单角色攻略。提交后会进入站长的投稿箱，审核通过才发布。
title: '[攻略] '
labels: ['submission']
body:
  - type: markdown
    attributes:
      value: |
        按下面 5 项填写即可，不需要懂 Markdown。
        提交后会进入**站长的投稿箱**，由站长决定发布或驳回。

  - type: input
    id: guide-title
    attributes:
      label: 标题
      description: 会显示在列表和搜索结果里
      placeholder: 今汐 2.4 版本养成与配队攻略
    validations:
      required: true

  - type: input
    id: character
    attributes:
      label: 角色
      description: 只写角色名，用于角色页归类
      placeholder: 今汐
    validations:
      required: true

  - type: textarea
    id: weapon
    attributes:
      label: 武器推荐
      description: 首选武器、替代武器、精炼建议
      placeholder: |
        首选：……
        替代：……
        说明：……
    validations:
      required: true

  - type: textarea
    id: sonata
    attributes:
      label: 声骸搭配及毕业面板
      description: 套装、主词条、副词条优先级，以及毕业面板参考值
      placeholder: |
        套装：……
        主词条：……
        副词条优先级：……
        毕业面板：攻击力 …… / 暴击 …… / 暴伤 ……
    validations:
      required: true

  - type: textarea
    id: team
    attributes:
      label: 配队要求
      description: 推荐队友、定位、以及队伍对轴的要求
      placeholder: |
        队友：主C …… / 副C …… / 治疗 ……
        轴：……
    validations:
      required: true

  - type: markdown
    attributes:
      value: '---'
  - type: markdown
    attributes:
      value: '以下为可选项'

  - type: input
    id: author
    attributes:
      label: 作者昵称（可选）
      placeholder: 洄游的鲸

  - type: input
    id: version
    attributes:
      label: 适用版本（可选）
      placeholder: '2.4'

  - type: input
    id: tags
    attributes:
      label: 标签（可选，逗号分隔）
      placeholder: 输出手法, 声骸

  - type: textarea
    id: images
    attributes:
      label: 图片链接（可选，一行一个）
      description: 面板 / 词条 / 伤害截图，先传到图床再粘贴链接
      placeholder: |
        https://…

  - type: input
    id: video
    attributes:
      label: 视频链接（可选）
      description: B 站 / YouTube 链接
      placeholder: https://www.bilibili.com/video/BV…
