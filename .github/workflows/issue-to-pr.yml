name: issue-to-pr

# 把「投稿」Issue 自动转成内容文件 + Pull Request。
#
# 为什么用它：Staticman 公共实例的机器人账号（staticmanapp）已被 GitHub 封禁，
# 旧的表单直提 PR 通道失效。这个工作流只用 GitHub 自己，零额外服务、零成本。
#
# 流程：访客用 Issue 模板提交 → 本工作流生成 src/content/**/issue-<N>.md → 开 PR
#       → 站长（仓库所有者）批准合并 → deploy-pages 自动发布。

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: >-
      contains(github.event.issue.title, '[攻略]') ||
      contains(github.event.issue.title, '[配队]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 生成内容文件并开 PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/issue-to-content.mjs
